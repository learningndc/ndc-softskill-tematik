<title>Soft Skill Tematik NDC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: ruang kontrol — daftar topik di kiri, jalur modul di kanan, bar subtitle narasi di bawah */
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#0f2236; --muted:#55687c; --line:#d3dbe4;
  --navy:#0d2b4e; --steel:#2f6690; --amber:#f2a516; --amber-ink:#7a4b00;
  --l0:#2f8f6b; --l1:#2f6690; --l2:#7a4fb0; --l3:#b2541b;
  --cap-bg:#0d2b4e; --cap-fg:#f4f7fb;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1624; --panel:#11233a; --ink:#e6edf5; --muted:#9fb1c4; --line:#22384f;
  --navy:#081a2e; --steel:#6aa5d6; --amber:#f5b53a; --amber-ink:#f5b53a;
  --l0:#53c39a; --l1:#6aa5d6; --l2:#b293e0; --l3:#ea8a4f; --cap-bg:#050f1b; --cap-fg:#eef3f8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1624; --panel:#11233a; --ink:#e6edf5; --muted:#9fb1c4; --line:#22384f;
  --navy:#081a2e; --steel:#6aa5d6; --amber:#f5b53a; --amber-ink:#f5b53a;
  --l0:#53c39a; --l1:#6aa5d6; --l2:#b293e0; --l3:#ea8a4f; --cap-bg:#050f1b; --cap-fg:#eef3f8; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ---------- Opening ---------- */
#intro{position:fixed;inset:0;z-index:50;background:#0d2b4e;color:#f4f7fb;display:grid;justify-items:center;align-items:start;overflow-y:auto;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:32px 32px;transition:opacity .7s ease}
#intro.gone{opacity:0;pointer-events:none}
.intro-inner{display:grid;justify-items:center;gap:18px;text-align:center;max-width:760px;padding-block:40px 110px}
.logo-wrap{width:220px;height:220px;display:grid;place-items:center;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo-wrap img{width:100%;height:100%;object-fit:cover}
#intro .logo-wrap{animation:logoIn 1.4s cubic-bezier(.2,.9,.2,1.2) both}
@keyframes logoIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.intro-eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#f5b53a}
.intro-title{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,7vw,56px);line-height:1.02;text-wrap:balance;margin:0}
.intro-tag{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,3vw,22px);color:#f5b53a;margin:0;text-wrap:balance}
.intro-tag-id{margin:-12px 0 0;color:#c6d4e3;font-style:italic;max-width:56ch}
.intro-desc{display:grid;gap:10px;text-align:left;max-width:62ch;color:#dbe5ef;margin:0}
.intro-desc p{margin:0}
.areas{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}
@media (max-width:560px){.areas{grid-template-columns:1fr}}
.areas h2{grid-column:1/-1;margin:6px 0 0;font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#93a9c0;text-align:center}
.area{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.area .c{font-family:var(--f-mono);font-size:12px;background:#f2a516;color:#1b1200;border-radius:6px;padding:4px 7px;flex:none}
.area b{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.15;display:block}
.area span{font-size:12px;color:#b9cadb}
.total{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;color:#f4f7fb;border-top:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16);padding:8px 14px}
.motto{display:grid;gap:2px}
.motto b{font-family:var(--f-display);font-size:clamp(20px,3.4vw,26px);letter-spacing:.02em}
.motto span{color:#c6d4e3;font-size:14px}
.intro-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-start{background:#f2a516;color:#1b1200;border:0;border-radius:999px;padding:14px 28px;font-weight:600;font-size:16px}
.btn-start:hover{background:#ffb72e}
.btn-listen{background:transparent;color:#f4f7fb;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:13px 22px;font-weight:600}
.btn-listen:hover{background:rgba(255,255,255,.1)}
.btn-listen[aria-pressed="true"]{border-color:#f2a516;color:#f5b53a}
.intro-note{font-size:12px;color:#93a9c0}
#intro .intro-eyebrow,#intro .intro-title,#intro .intro-tag{animation:rise .8s .5s both}
#intro .intro-desc,#intro .areas,#intro .total,#intro .motto{animation:rise .8s .3s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- App shell ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{background:var(--navy);color:#f4f7fb;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .mini-logo{width:42px;height:42px;border-radius:50%;background:#fff;overflow:hidden;flex:none}
.top .mini-logo img{width:100%;height:100%;object-fit:cover}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--f-display);font-size:21px;letter-spacing:.02em}
.brand span{font-size:12px;color:#b9cadb}
.controls{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ctl{background:rgba(255,255,255,.1);color:#f4f7fb;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:7px 12px;font-size:13px}
.ctl:hover{background:rgba(255,255,255,.18)}
.ctl[aria-pressed="true"]{background:#f2a516;color:#1b1200;border-color:#f2a516}

main{flex:1;display:grid;grid-template-columns:300px 1fr;gap:20px;padding-block:20px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;width:100%;margin:0 auto;box-sizing:border-box}
@media (max-width:860px){main{grid-template-columns:1fr}}

.topics{display:flex;flex-direction:column;gap:10px;min-width:0}
.topics h2{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 2px;font-weight:500}
.topic-list{display:flex;flex-direction:column;gap:10px}
@media (max-width:860px){.topic-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}}
@media (max-width:520px){.topic-list{grid-template-columns:1fr}}
.topic{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;transition:border-color .2s,transform .2s}
.topic:hover{border-color:var(--steel)}
.topic .code{grid-row:span 2;font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;align-self:start;color:var(--steel)}
.topic .name{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.1}
.topic .meta{font-size:12px;color:var(--muted)}
.topic.active{border-color:var(--amber);box-shadow:inset 4px 0 0 var(--amber)}
.topic.active .code{background:var(--amber);color:#1b1200;border-color:var(--amber)}
.topic.speaking{transform:translateX(4px)}

/* ---------- Topic stage ---------- */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0;display:flex;flex-direction:column;gap:18px}
.stage-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.stage-head .t{flex:1;min-width:220px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber-ink)}
.stage h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,38px);line-height:1.05;margin:4px 0 6px;text-wrap:balance}
.stage p.lead{margin:0;color:var(--muted);max-width:62ch}
.btn-play{background:var(--steel);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
:root[data-theme="dark"] .btn-play{color:#06111d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-play{color:#06111d}}
.btn-play:hover{filter:brightness(1.08)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.pipe-wrap{overflow-x:auto;padding-bottom:4px}
.pipe{position:relative;display:grid;padding:26px 6px 4px}
.pipe::before{content:"";position:absolute;left:30px;right:30px;top:47px;height:8px;border-radius:4px;background:var(--line)}
.pipe .flow{position:absolute;left:30px;top:47px;height:8px;border-radius:4px;width:0;
  background:repeating-linear-gradient(90deg,var(--amber) 0 14px,color-mix(in srgb,var(--amber) 55%,transparent) 14px 28px);
  background-size:28px 8px;animation:flow 1s linear infinite;transition:width .6s ease}
@keyframes flow{to{background-position:28px 0}}
.zone{position:absolute;top:0;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.node{position:relative;z-index:1;display:grid;justify-items:center;align-content:start;gap:6px;background:none;border:0;color:var(--ink);padding:0 2px}
.node .dot{width:50px;height:50px;border-radius:50%;background:var(--panel);border:3px solid var(--c);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--c);transition:transform .25s,background .25s,color .25s}
.node .lbl{font-size:11px;line-height:1.25;text-align:center;color:var(--muted);max-width:14ch}
.node:hover .dot{transform:scale(1.08)}
.node.done .dot{background:color-mix(in srgb,var(--c) 18%,var(--panel))}
.node.on .dot{background:var(--c);color:#fff;transform:scale(1.15);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent)}
.node.on .lbl{color:var(--ink);font-weight:600}

.detail{display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid var(--line);padding-top:18px}
@media (max-width:700px){.detail{grid-template-columns:1fr}}
.detail > div{min-width:0}
.detail .code-l{font-family:var(--f-mono);font-size:13px;color:var(--c)}
.detail h3{font-family:var(--f-display);font-size:26px;line-height:1.1;margin:2px 0 8px;text-wrap:balance}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;color:var(--c);border:1px solid var(--c)}
.detail p{margin:10px 0 0}
.detail .dlabel{display:block;margin-top:12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono)}
.detail .dlabel + p{margin-top:2px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.box h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono);font-weight:500}
.box h4 + ul, .box h4 + p{margin-top:0}
.box * + h4{margin-top:12px}
.box ul{margin:0;padding-left:18px}
.box p{margin:0}
.box li+li{margin-top:4px}
.navrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px}
.btn-ghost:hover{border-color:var(--steel)}

.caption{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--cap-bg);color:var(--cap-fg);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:14px;align-items:center;box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.wave{display:flex;gap:3px;align-items:flex-end;height:22px;flex:none}
.wave span{width:4px;height:6px;background:#f2a516;border-radius:2px}
.caption.talk .wave span{animation:wv .9s ease-in-out infinite}
.wave span:nth-child(2){animation-delay:.15s}.wave span:nth-child(3){animation-delay:.3s}.wave span:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:6px}50%{height:22px}}
#capText{margin:0;font-size:15px;line-height:1.45;min-width:0;max-width:110ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="intro"><div class="intro-inner" id="introInner"></div></div>

<div class="app">
  <header class="top">
    <div class="mini-logo" id="miniLogo"></div>
    <div class="brand"><b>NDC Learning</b><span id="brandSub"></span></div>
    <div class="controls">
      <button class="ctl" id="btnOverview">⟲ Halaman pembukaan</button>
      <button class="ctl" id="btnMute" aria-pressed="false">🔊 Suara aktif</button>
      <button class="ctl" id="btnStop">■ Hentikan</button>
    </div>
  </header>
  <main>
    <section class="topics" aria-label="Topik">
      <h2 id="topicsHead"></h2>
      <div class="topic-list" id="topicList"></div>
    </section>
    <section class="stage" id="stage" aria-live="polite"></section>
  </main>
</div>

<div class="caption" id="caption">
  <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <p id="capText">Tekan Dengarkan pembukaan untuk mendengar narasi, atau Masuk untuk membuka katalog modul.</p>
</div>

const CFG = {"brandSub":"Kurikulum Soft Skill Tematik · Katalog Modul","topicsHead":"6 Tema","topicWord":"Tema","intro":{"eyebrow":"NDC Learning","title":"Kurikulum Soft Skill Tematik","tag":"Learn • Practice • Grow","tagId":"Bridging Knowledge, People, and Opportunities.","desc":["Kurikulum Soft Skill Tematik merupakan program soft skill NDC Learning yang disusun per tema. Peserta bebas memilih tema sesuai kebutuhan, dan setiap tema naik bertahap dari dasar sampai proyek nyata.","Program ini ditujukan untuk mahasiswa semua jurusan dan semester, lulusan baru, serta pekerja muda. Pendekatannya 30% materi dan 70% praktik melalui simulasi, permainan peran, studi kasus, dan proyek, dengan setiap modul berlangsung 3 jam."],"areasTitle":"Our Soft Skill Learning Themes","total":"Total: 24 Modul | 6 Tema | 72 Jam | 70% Praktik","mottos":[["Learn • Practice • Grow","Belajar, Berlatih, dan Berkembang."],["Bridging Knowledge, People, and Opportunities.","Menghubungkan Pengetahuan, Manusia, dan Peluang."]],"speech":["Selamat datang di NDC Learning and Professional Community. Learn, Practice, Grow.","Kurikulum Soft Skill Tematik merupakan program soft skill NDC Learning yang disusun per tema. Peserta bebas memilih tema sesuai kebutuhan, dan setiap tema naik bertahap dari dasar sampai proyek nyata.","Program ini ditujukan untuk mahasiswa semua jurusan dan semester, lulusan baru, serta pekerja muda. Pendekatannya tiga puluh persen materi dan tujuh puluh persen praktik, melalui simulasi, permainan peran, studi kasus, dan proyek. Setiap modul berlangsung tiga jam.","Terdapat enam tema: Komunikasi Efektif, Kepemimpinan dan Kerja Sama Tim, Manajemen Waktu dan Produktivitas, Berpikir Kritis dan Pemecahan Masalah, Persiapan Karier dan Profesionalisme, dan Kreativitas dan Kemampuan Beradaptasi. Setiap tema berisi empat modul, dengan total dua puluh empat modul.","Bridging Knowledge, People, and Opportunities.","Tekan tombol Masuk untuk membuka katalog modul."]},"overview":"Inilah katalog Kurikulum Soft Skill Tematik. Dua puluh empat modul dalam enam tema. Di setiap tema, modul naik bertahap dari level Dasar, Terapan, Lanjut, hingga Proyek.","closing":"Silakan pilih tema di sebelah kiri, lalu klik modul untuk mendengar penjelasannya. Learn, Practice, Grow, bersama NDC Learning.","levels":[{"name":"Dasar","from":0,"to":0,"range":"modul 1","c":"var(--l0)"},{"name":"Terapan","from":1,"to":1,"range":"modul 2","c":"var(--l1)"},{"name":"Lanjut","from":2,"to":2,"range":"modul 3","c":"var(--l2)"},{"name":"Proyek","from":3,"to":3,"range":"modul 4","c":"var(--l3)"}],"topics":[{"code":"KOM","name":"Komunikasi Efektif","spoken":"tema Komunikasi Efektif","lead":"Melatih peserta berbicara, mendengar, dan menulis dengan jelas dan percaya diri, di kampus maupun di tempat kerja.","say":"Tema pertama adalah Komunikasi Efektif. Tema ini melatih peserta berbicara, mendengar, dan menulis dengan jelas dan percaya diri.","mods":[{"code":"KOM-1","name":"Dasar Komunikasi & Mendengar Aktif","descLabel":"Topik inti","desc":"Model komunikasi, hambatan, mendengar aktif, bertanya terbuka","boxes":[["Praktik","Permainan \"instruksi tanpa melihat\", latihan parafrase berpasangan"],["Output","Lembar refleksi gaya komunikasi"]],"speak":"Modul pertama, Dasar Komunikasi dan Mendengar Aktif. Peserta mengenal model komunikasi dan hambatannya, lalu berlatih mendengar aktif dan bertanya terbuka. Latihannya seru, misalnya permainan memberi instruksi tanpa melihat. Hasilnya, peserta membuat lembar refleksi tentang gaya komunikasinya sendiri."},{"code":"KOM-2","name":"Berbicara di Depan Umum","descLabel":"Topik inti","desc":"Struktur pembuka–isi–penutup, bahasa tubuh, mengatasi gugup","boxes":[["Praktik","Presentasi 3 menit, direkam dan dinilai sesama peserta"],["Output","Video presentasi + umpan balik"]],"speak":"Modul kedua, Berbicara di Depan Umum. Peserta belajar menyusun pembuka, isi, dan penutup, memakai bahasa tubuh, dan mengatasi rasa gugup. Setiap peserta tampil tiga menit, direkam,  Peserta membangun pola pikir bertumbuh, belajar dari kegagalan, dan belajar cepat dengan bantuan kecerdasan buatan secara bertanggung jawab. Selama satu minggu, peserta menguasai satu keterampilan baru dan mencatatnya di jurnal."},{"code":"KRE-3","name":"Beradaptasi dengan Perubahan & Tekanan","descLabel":"Topik inti","desc":"Menghadapi perubahan rencana, mengelola stres, ketangguhan (resiliensi)","boxes":[["Praktik","Simulasi situasi berubah mendadak (jadwal, tim, target)"],["Output","Rencana menghadapi 2 skenario perubahan"]],"speak":"Modul ketiga, Beradaptasi dengan Perubahan dan Tekanan. Peserta berlatih menghadapi perubahan mendadak, seperti jadwal, tim, atau target yang berubah, sambil belajar mengelola stres dan membangun ketangguhan."},{"code":"KRE-4","name":"Proyek: Design Thinking","descLabel":"Topik inti","desc":"Empati, definisi masalah, ide, prototipe, uji coba","boxes":[["Praktik","Tim merancang solusi sederhana dan mengujinya ke calon pengguna"],["Output","Prototipe + presentasi pitching 5 menit"]],"speak":"Modul keempat adalah proyek: Design Thinking. Dalam tim, peserta melewati tahap empati, definisi masalah, ide, prototipe, dan uji coba, lalu mempresentasikan solusinya dalam pitching lima menit."}]}]};

const TOPICS = CFG.topics, LEVELS = CFG.levels;

const pad = i => String(i+1).padStart(2,"0");

/* ---------- Speech ---------- */
const synth = window.speechSynthesis;
let muted = false, voice = null, runId = 0;
const cap = document.getElementById("caption"), capText = document.getElementById("capText");
function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices();
  voice = vs.find(v=>/id[-_]ID/i.test(v.lang) && /google|natural|online/i.test(v.name)) || vs.find(v=>/^id/i.test(v.lang)) || null;
}
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
const wait = ms => new Promise(r=>setTimeout(r,ms));
async function say(text, id){
  capText.textContent = text;
  const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
  cap.classList.add("talk");
  for(const p of parts){
    if(id !== runId) break;
    if(muted || !synth){ await wait(Math.max(1600, p.length*55)); continue; }
    await new Promise(res=>{
      const u = new SpeechSynthesisUtterance(p.trim());
      u.lang = "id-ID"; if(voice) u.voice = voice; u.rate = 1; u.pitch = 1;
      const guard = setTimeout(res, Math.max(4000, p.length*120));
      u.onend = u.onerror = ()=>{ clearTimeout(guard); res(); };
      synth.speak(u);
    });
  }
  if(id === runId) cap.classList.remove("talk");
}
function stopAll(){ runId++; if(synth) synth.cancel(); cap.classList.remove("talk"); }

/* ---------- Render ---------- */
let curT = 0, curM = -1;
const topicList = document.getElementById("topicList"), stage = document.getElementById("stage");
topicList.innerHTML = TOPICS.map((t,i)=>`
  <button class="topic" data-t="${i}" id="topic-${i}">
    <span class="code">${esc(t.code)}</span>
    <span class="name">${esc(t.name)}</span>
    <span class="meta">${t.mods.length} modul · ${LEVELS[0].name} → ${LEVELS.at(-1).name}</span>
  </button>`).join("");
topicList.addEventListener("click", e=>{
  const b = e.target.closest(".topic"); if(!b) return;
  stopAll(); const id = runId;
  showTopic(+b.dataset.t, -1);
  say(TOPICS[curT].say + " Klik salah satu modul, atau tekan Putar topik ini untuk mendengar seluruh modul.", id);
});

function showTopic(t, m){
  curT = t; curM = m;
  document.querySelectorAll(".topic").forEach((el,i)=>el.classList.toggle("active", i===t));
  const T = TOPICS[t], n = T.mods.length;
  const nodes = T.mods.map((md,i)=>{
    const L = LEVELS[lvOf(i)];
    return `<button class="node ${i===m?'on':''} ${m>=0&&i<m?'done':''}" data-m="${i}" style="--c:${L.c}" aria-label="${esc(md.code)} ${esc(md.name)}">
      <span class="dot">${pad(i)}</span><span class="lbl">${esc(md.name)}</span></button>`;
  }).join("");
  const flowW = m<=0 ? 0 : `calc(${m/(n-1)} * (100% - 60px))`;
  const zones = LEVELS.map(l=>`<span class="zone" style="left:calc(6px + ${l.from/n*100}%);color:${l.c}">${esc(l.name)}</span>`).join("");
  stage.innerHTML = `
    <div class="stage-head">
      <div class="t">
        <div class="eyebrow">${esc(CFG.topicWord)} ${t+1} dari ${TOPICS.length} · Kode ${esc(T.code)}</div>
        <h1>${esc(T.name)}</h1>
        <p class="lead">${esc(T.lead)}</p>
      </div>
      <button class="btn-play" id="btnPlayTopic">▶ Putar topik ini</button>
    </div>
    <div class="legend">${LEVELS.map(l=>`<span><i style="background:${l.c}"></i>${esc(l.name)} · ${esc(l.range)}</span>`).join("")}</div>
    <div class="pipe-wrap"><div class="pipe" id="pipe" style="grid-template-columns:repeat(${n},minmax(64px,1fr));min-width:${n*66}px">
      ${zones}<div class="flow" style="width:${flowW}"></div>${nodes}
    </div></div>
    ${m<0 ? `<div class="detail"><div class="box" style="grid-column:1/-1"><h4>Cara memakai</h4>
      <ul><li>Klik nomor modul pada jalur di atas untuk mendengar penjelasannya.</li>
      <li>Tekan <b>Putar topik ini</b> untuk narasi otomatis ${n} modul berurutan.</li>
      <li>Jalur bergerak dari ${esc(LEVELS[0].name)} ke ${esc(LEVELS.at(-1).name)}, sesuai urutan belajar yang disarankan.</li></ul></div></div>` : detailHTML(T, m)}`;
  stage.querySelector("#pipe").addEventListener("click", e=>{
    const nd = e.target.closest(".node"); if(!nd) return;
    stopAll(); const id = runId; showTopic(curT, +nd.dataset.m); say(TOPICS[curT].mods[curM].speak, id);
  });
  stage.querySelector("#btnPlayTopic").addEventListener("click", ()=>playTopic(curT));
  const prev = stage.querySelector("#btnPrev"), next = stage.querySelector("#btnNext");
  if(prev) prev.addEventListener("click", ()=>{ stopAll(); const id=runId; showTopic(curT, curM-1); say(TOPICS[curT].mods[curM].speak, id); });
  if(next) next.addEventListener("click", ()=>{ stopAll(); const id=runId; showTopic(curT, curM+1); say(TOPICS[curT].mods[curM].speak, id); });
}

function detailHTML(T, m){
  const md = T.mods[m], L = LEVELS[lvOf(m)], n = T.mods.length;
  const block = ([label, val]) => `<h4>${esc(label)}</h4>` + (Array.isArray(val) ? `<ul>${val.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : `<p>${esc(val)}</p>`);
  return `<div class="detail" style="--c:${L.c}">
    <div>
      <div class="code-l">${esc(md.code)}</div>
      <h3>${esc(md.name)}</h3>
      <span class="pill">${esc(L.name)}</span>
      ${md.descLabel ? `<span class="dlabel">${esc(md.descLabel)}</span>` : ""}
      <p>${esc(md.desc)}</p>
      <div class="navrow">
        ${m>0?`<button class="btn-ghost" id="btnPrev">← Modul sebelumnya</button>`:""}
        ${m<n-1?`<button class="btn-ghost" id="btnNext">Modul berikutnya →</button>`:""}
      </div>
    </div>
    <div class="box">${md.boxes.map(block).join("")}</div>
  </div>`;
}

async function playTopic(t){
  stopAll(); const id = runId;
  showTopic(t, -1);
  await say(TOPICS[t].say, id);
  const n = TOPICS[t].mods.length;
  for(let m=0; m<n; m++){
    if(id !== runId) return;
    const L = LEVELS[lvOf(m)];
    if(L.announce && m === L.from){ await say(L.announce, id); if(id !== runId) return; }
    showTopic(t, m);
    await say(TOPICS[t].mods[m].speak, id);
    await wait(400);
  }
  if(id === runId) say(`Itulah ${n} modul ${TOPICS[t].spoken || TOPICS[t].name}. Silakan pilih topik lain di sebelah kiri.`, id);
}

async function overview(){
  stopAll(); const id = runId;
  showTopic(0, -1);
  await say(CFG.overview, id);
  for(let t=0; t<TOPICS.length; t++){
    if(id !== runId) return;
    showTopic(t, -1);
    const el = document.getElementById("topic-"+t); el.classList.add("speaking");
    await say(TOPICS[t].say, id);
    el.classList.remove("speaking");
  }
  if(id !== runId) return;
  showTopic(0, -1);
  say(CFG.closing, id);
}

const intro = document.getElementById("intro");
const btnListen = document.getElementById("btnListen");
const resetListen = ()=>{ btnListen.setAttribute("aria-pressed","false"); btnListen.textContent="🔊 Dengarkan pembukaan"; };
btnListen.addEventListener("click", async ()=>{
  if(btnListen.getAttribute("aria-pressed")==="true"){ stopAll(); resetListen(); return; }
  stopAll(); const id = runId;
  btnListen.setAttribute("aria-pressed","true"); btnListen.textContent="■ Hentikan narasi";
  for(const line of I.speech){ if(id!==runId) break; await say(line, id); }
  if(id===runId) resetListen();
});
document.getElementById("btnStart").addEventListener("click", ()=>{
  stopAll(); resetListen();
  intro.classList.add("gone"); setTimeout(()=>intro.hidden=true, 700);
  overview();
});
document.getElementById("btnOverview").addEventListener("click", ()=>{
  stopAll(); intro.hidden = false; intro.scrollTop = 0;
  const bl = document.getElementById("bigLogo"); bl.style.animation="none"; void bl.offsetWidth; bl.style.animation="";
  requestAnimationFrame(()=>intro.classList.remove("gone"));
  capText.textContent = "Tekan Dengarkan pembukaan untuk mendengar narasi, atau Masuk untuk membuka katalog modul.";
});
document.getElementById("btnStop").addEventListener("click", ()=>{ stopAll(); capText.textContent = "Narasi dihentikan. Klik modul untuk melanjutkan."; });
const bm = document.getElementById("btnMute");
bm.addEventListener("click", ()=>{
  muted = !muted; bm.setAttribute("aria-pressed", muted);
  bm.textContent = muted ? "🔇 Suara mati (subtitle saja)" : "🔊 Suara aktif";
  if(muted && synth) synth.cancel();
});
if(!synth){ capText.textContent = "Browser ini tidak mendukung suara otomatis. Narasi tampil sebagai subtitle."; }
showTopic(0, -1);
</script>

</body></html>
